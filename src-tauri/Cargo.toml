[package]
name = "registro"
version = "0.1.2"
edition = "2021"
description = "Sistema de Registro para Servicio Técnico"
authors = ["Roberth Silva"]

[lib]
name = "registro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
serialport = "4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
